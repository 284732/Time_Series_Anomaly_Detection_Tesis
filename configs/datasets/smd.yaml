# Spec del dataset SMD (F3, D-58). Valori strutturali di SMD come dati, non come costanti nel codice.
# Controlli bloccanti di D-32: |T_train - T_test| <= max_len_diff, n_features sensori, label = test,
# valori in value_range (D-26), hash dei file uguali al riferimento hashes_file (D-61).
# Percorsi relativi alla cartella di questo file.
name: smd
layout: smd_txt
n_features: 38
max_len_diff: 1
value_range: [0.0, 1.0]
label_values: [0, 1]
split_file: ../dev_machines.yaml      # D-51
hashes_file: smd_sha256.yaml          # D-61: generato da scripts/make_data_hashes.py (lo lancia l'utente)
groups:                               # 28 macchine: gruppo 1 (8), 2 (9), 3 (11)
  "1":
    - machine-1-1
    - machine-1-2
    - machine-1-3
    - machine-1-4
    - machine-1-5
    - machine-1-6
    - machine-1-7
    - machine-1-8
  "2":
    - machine-2-1
    - machine-2-2
    - machine-2-3
    - machine-2-4
    - machine-2-5
    - machine-2-6
    - machine-2-7
    - machine-2-8
    - machine-2-9
  "3":
    - machine-3-1
    - machine-3-2
    - machine-3-3
    - machine-3-4
    - machine-3-5
    - machine-3-6
    - machine-3-7
    - machine-3-8
    - machine-3-9
    - machine-3-10
    - machine-3-11
