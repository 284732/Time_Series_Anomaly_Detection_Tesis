# M1 (D-50; decisione D3 dell'utente del 2026-11-19): un solo esperimento per i due run storici di riferimento,
# results/results_tests/results_repro_last_01 e results_repro_mean_01. Le due config storiche differiscono solo per
# l'aggregazione nella finestra, che è un livello dell'analisi (D-33: il fit salva i residui last e mean): i fit sono
# gli stessi, i due run diventano due piani di analisi (configs/analysis/parity_last.yaml e parity_mean.yaml).
# L'equivalenza con la config effettiva di main.py è verificata da tests/test_m1_configs.py. Seed nell'ordine storico,
# 42 per primo (nota di M1).
#
# F8 passo 2 (D-77, strategia (i)): ogni valore che entra in config_sha256 o nel fit_key è dichiarato qui (valori
# STORICI, gli stessi che base.yaml e configs/models/ avevano al run di M1), così questo esperimento non eredita nulla
# da base.yaml (dove F8 metterà i valori canonici) né da configs/models/ (le griglie di F9 stanno fuori dal
# loader, in configs/tuning/grid.yaml, D-41).
# config_sha256 e fit_key coincidono con quelli del run di M1 (tests/test_f8_config_loading.py).
experiment:
  name: parity_repro
  kind: exploratory
  seeds: [42]
paths:
  store_root: store
device: cpu
data:
  dataset: smd
  data_dir: dataset
  machines: [machine-1-1, machine-3-8]
split:
  mode: legacy2
  val_ratio: 0.2
preprocessing:
  scaler_type: minmax
  min_range: 0.0
  clip: null
windows:
  window_size: 100
  step: 1
  train_step: 5
training:
  max_epochs: 40
  patience: 5
  min_delta: 1.0e-6
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  batch_size: 64
models:
  pca:
    n_components: 0.9
    random_state: 42
  pca_pointwise:
    n_components: 0.9
  conv_autoencoder:
    channels: [32, 64]
    latent_dim: 16
  lstm_autoencoder:
    hidden_dim: 64
    latent_dim: 16
run_models: [pca, pca_pointwise, conv_autoencoder, lstm_autoencoder]
